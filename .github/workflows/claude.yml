name: claude-tasks

# 맥이 꺼져 있어도 GitHub 서버에서 Claude 작업 실행 (Claude Pro 구독 토큰 사용)
on:
  workflow_run:
    workflows: ["daily-collect"]
    types: [completed]
  schedule:
    - cron: "*/15 23,0-14 * * *"   # 08:00~23:59 KST, 15분마다 (할 일 없으면 Claude 호출 없이 종료)
  workflow_dispatch:
    inputs:
      only:
        description: "A=요청 B=추천 C=광고 D=검증 E=큐레이션 (비우면 전부)"
        required: false
        default: ""

concurrency:
  group: claude-tasks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude tasks
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: python3 scripts/claude_tasks.py
      - name: Save curation
        if: always()
        run: |
          if [ -f .ai_updated ]; then
            git config user.name "curation-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/ai.json
            git commit -m "ai: $(TZ=Asia/Seoul date +%F) 큐레이션" || exit 0
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
