<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>데일리 큐레이션 보드</title>
<style>
:root{--bg:#FBFAF7;--navy:#1B2136;--coral:#E2674A;--line:#E8E4DC;--sub:#6B6F7B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
a{color:inherit}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;gap:14px;padding:16px 0 8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}h1 b{color:var(--coral)}
.upd{color:var(--sub);font-size:13px}
.search{margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:240px;font-size:14px;background:#fff}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 13px;font-size:14px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);font-weight:700;border-color:var(--coral)}
nav .cnt{font-size:11px;color:var(--sub);margin-left:4px}
main{padding:18px 0 60px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px}.sec small{font-weight:400;color:var(--sub);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.thumb{aspect-ratio:4/5;background:#F1EEE7 center/cover no-repeat;display:block}
.thumb.none{display:none}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.acc{font-size:13px;font-weight:700;padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc span{font-weight:400;color:var(--sub)}
.cap{font-size:14px;line-height:1.45;color:#2b3045;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:9px;font-size:12px;color:var(--sub);align-items:center;flex-wrap:wrap;margin-top:auto}
.badge{background:#FDECE7;color:var(--coral);font-weight:700;border-radius:6px;padding:2px 7px}
.badge.mid{background:#EEF0F5;color:var(--navy)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.open{font-weight:600;text-decoration:none;margin-left:auto;color:var(--navy)}
.star{position:absolute;top:8px;right:8px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:#C9C4BA;z-index:2}
.star.on{color:var(--coral)}
.nothumb .star{background:none}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#F4F1EA;font-size:12px;color:var(--sub);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td a{text-decoration:none}td a:hover{text-decoration:underline}
.empty{color:var(--sub);padding:30px;text-align:center}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.err{color:#B0412B}
.intro{font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.5}
.folder{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:4px 14px}
.folder summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:15px}.folder summary small{color:var(--sub);font-weight:400;margin-left:6px}
.folder .grid{padding:4px 0 14px}
.saved{font-size:11px;color:var(--sub)}
.lbl{font-size:12px;color:var(--sub)}
td.st{width:34px;padding:6px 4px 6px 10px}.tstar{border:0;background:none;font-size:16px;cursor:pointer;color:#C9C4BA}.tstar.on{color:var(--coral)}
.who{font-size:12px;color:var(--sub);white-space:nowrap}.who a{color:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translateX(-50%)}.toast.err{background:#B0412B}
.angle{font-size:12.5px;color:var(--navy);background:#FFF6E8;border-radius:6px;padding:5px 8px}
.tag.endb{border-color:#E9C9A8;color:#9A5B1E}.tag.endd{border-color:#ddd;color:#999}.card.dim{opacity:.55}
.addbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.addbox input,.addbox select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}.addbox #chHandle{flex:1;min-width:260px}.addbox #chNote{width:200px}
.chip.del{color:#B0412B;border-color:#EBC9C0;white-space:nowrap}
td:first-child{white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:6px}
.topic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.topic .th{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}.topic .th small{margin-left:auto;color:var(--sub);font-weight:400;font-size:12px}
.topic ul{margin:0;padding-left:16px;font-size:13px;line-height:1.6}.topic li a{text-decoration:none}.topic li small{color:var(--sub)}
.up{color:#C2410C;font-size:12px}.down{color:#2563EB;font-size:12px}.flat{color:var(--sub);font-size:12px}
.scbtn{margin-top:4px;border:1px dashed #D9CBB5;background:#FFFBF4;color:var(--navy);border-radius:8px;padding:7px;font-size:13px;cursor:pointer;width:100%}.scbtn.has{border-style:solid;background:#F4F1EA}
.tsc{border:0;background:none;cursor:pointer;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(27,33,54,.45);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:40px 12px}.modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px 24px;position:relative}.mclose{position:absolute;right:14px;top:12px;border:0;background:none;font-size:18px;cursor:pointer}
.mhead{font-size:18px;font-weight:700}.mhead small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}.mmeta{font-size:12px;color:var(--sub);margin:4px 0}
.msec{font-weight:700;margin:16px 0 6px;font-size:14px}.hooks{margin:0;padding-left:20px;line-height:1.7}
.sctable{border:1px solid var(--line)}.sctable td{font-size:15px;line-height:1.5}.sctable td.scr{font-size:12.5px;color:#7A5A2B;background:#FFFBF4;width:36%}
.capbox{background:#F7F5F0;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55}.capbox .tags{color:#2563EB;margin-top:6px;font-size:13px}
.checks{margin:0;padding-left:20px;font-size:13.5px;color:#9A3412;line-height:1.6}
.mbar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}.mbar input{flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}.mbar a.chip{text-decoration:none}
.guide .gbody{font-size:14px;line-height:1.75;padding:0 6px 10px}.guide ol{padding-left:20px;margin:0}
.sclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.scitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}.scitem .hook{margin:6px 0;font-size:14px}.scitem small{color:var(--sub)}
.why{display:flex;gap:5px;flex-wrap:wrap}.why span{font-size:11px;background:#F4F1EA;border-radius:4px;padding:2px 6px;color:var(--navy)}
@media(max-width:640px){.search{width:100%;margin-left:0}.grid{grid-template-columns:1fr 1fr}.thumb{aspect-ratio:1}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>데일리 <b>큐레이션</b> 보드</h1><span class="upd" id="upd">불러오는 중…</span>
  <input class="search" id="q" placeholder="캡션·계정·제목 검색"><span class="who" id="who"></span></div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbx_bxTi39uwrssjbst255QjPBY_p1KNQwRA8KAgzj_h9DNHjcw3BUpfNZntsy8ItxEw/exec';
const CATS=['아이랑 갈 곳','육아 정보','해설·인물','밈·트렌드'];
const CAT_DAYS={'아이랑 갈 곳':7,'육아 정보':30,'해설·인물':30,'밈·트렌드':30};
const TABS=['오늘의 추천','반응 좋은 글',...CATS,'맘카페 인기글','찜한 후보','스크립트','채널 목록'];
let SC={}, D=null, tab='오늘의 추천', sort='new', cafeSel='전체', kidOnly=false, q='', bmMode='week', CH=null, BM={}, LOOKUP={}, busy=false;
const open_={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'-':n>=10000?(n/10000).toFixed(n>=100000?0:1)+'만':Math.round(n).toLocaleString();
const kst=iso=>iso?new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const day=iso=>iso?new Date(iso).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'}):'';
const hoursAgo=iso=>iso?(Date.now()-new Date(iso))/36e5:1e9;
const kstParts=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).split('-').map(Number);
const s2=n=>String(n).padStart(2,'0');const WD=['일','월','화','수','목','금','토'];
function dateKey(iso){const [y,m,d]=kstParts(iso);const dt=new Date(Date.UTC(y,m-1,d));return {key:y+'-'+s2(m)+'-'+s2(d),label:m+'월 '+d+'일 ('+WD[dt.getUTCDay()]+')'}}
function weekKey(iso){const [y,m,d]=kstParts(iso);const dt=new Date(Date.UTC(y,m-1,d));const wd=(dt.getUTCDay()+6)%7;const mon=new Date(dt-wd*864e5),sun=new Date(+mon+6*864e5),thu=new Date(+mon+3*864e5);
  const f=new Date(Date.UTC(thu.getUTCFullYear(),thu.getUTCMonth(),1));const firstThu=1+(4-f.getUTCDay()+7)%7;const n=Math.floor((thu.getUTCDate()-firstThu)/7)+1;
  const md=x=>(x.getUTCMonth()+1)+'/'+x.getUTCDate();return {key:mon.toISOString().slice(0,10),label:thu.getUTCFullYear()+'년 '+(thu.getUTCMonth()+1)+'월 '+n+'주차 ('+md(mon)+' ~ '+md(sun)+')'}}
// ---------- 팀 사용자 (이름 + 팀 비밀번호, 이 브라우저에 기억) ----------
function getUser(){try{return JSON.parse(localStorage.getItem('bs_user')||'null')}catch(e){return null}}
function setUser(u){try{localStorage.setItem('bs_user',JSON.stringify(u))}catch(e){}}
function askUser(force){let u=getUser();if(u&&!force)return u;const name=prompt('이름(찜·채널 추가 기록에 표시돼요)',u?.name||'');if(name===null)return null;const pass=prompt('팀 비밀번호',u?.pass||'');if(pass===null)return null;u={name:name.trim()||'팀원',pass:pass.trim()};setUser(u);renderUser();return u}
function renderUser(){const u=getUser();document.getElementById('who').innerHTML=u?esc(u.name)+' <a href="#" id="chgUser">변경</a>':'<a href="#" id="chgUser">팀 로그인</a>'}
async function api(action,body={}){const u=askUser(false);if(!u)throw new Error('취소됨');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,action,pass:u.pass,by:u.name})});const j=await r.json();
  if(!j.ok){if(/비밀번호/.test(j.error||'')){setUser(null);renderUser()}throw new Error(j.error||'실패')}return j}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}
// ---------- 공유 찜 ----------
function bmFromList(list){BM={};for(const b of list||[])BM[b.id]={savedAt:b.saved_at,savedBy:b.saved_by,item:b.item}}
async function toggleBM(id){if(busy)return;const had=BM[id];const item=had?had.item:LOOKUP[id];if(!item)return;
  const u=askUser(false);if(!u)return;busy=true;
  if(had)delete BM[id];else BM[id]={savedAt:new Date().toISOString(),savedBy:u.name,item};render();
  try{const j=await api(had?'removeBookmark':'addBookmark',{id,item});bmFromList(j.bookmarks);toast(had?'찜을 뺐어요':'찜했어요 (팀 전체에 보여요)')}
  catch(e){if(had)BM[id]=had;else delete BM[id];toast('저장 실패: '+e.message,1)}finally{busy=false;render()}}
// ---------- 공통 렌더 ----------
let kidRe=/아이랑/;
const accMap=()=>Object.fromEntries(D.instagram.accounts.map(a=>[a.handle,a]));
const match=t=>!q||String(t).toLowerCase().includes(q.toLowerCase());
const starBtn=id=>'<button class="star'+(BM[id]?' on':'')+'" data-star="'+esc(id)+'" title="찜하기">★</button>';
function endBadge(p){if(!p.event_end)return '';const e=new Date(p.event_end);return p.ended?'<span class="tag endd">종료됨</span>':'<span class="tag endb">~'+(e.getMonth()+1)+'/'+e.getDate()+'까지</span>'}
function card(p,A,extra=''){const r=p.ratio;const b=r==null?'':'<span class="badge'+(r<2?' mid':'')+'">평소 ×'+r+'</span>';
  const th=p.thumb?'<a class="thumb" href="'+esc(p.permalink)+'" target="_blank" rel="noopener" style="background-image:url(\''+esc(p.thumb)+'\')"></a>':'';
  return '<div class="card'+(p.thumb?'':' nothumb')+(p.ended?' dim':'')+'">'+starBtn(p.permalink)+th+'<div class="body"><div class="acc">@'+esc(p.handle)+' <span>'+esc((A[p.handle]||{}).name||p.name||'')+'</span></div><div class="cap">'+esc(p.caption||'(캡션 없음)')+'</div>'+extra+
  '<div class="meta">'+b+'<span>♥ '+fmt(p.likes)+'</span><span>💬 '+fmt(p.comments)+'</span><span>'+day(p.timestamp)+'</span>'+endBadge(p)+'<span class="tag">'+(p.media_type==='REELS'?'릴스':'게시물')+'</span><a class="open" href="'+esc(p.permalink)+'" target="_blank" rel="noopener">원문 →</a></div>'+scBtn(p.permalink)+'</div></div>'}
function cafeCard(r,extra=''){return '<div class="card nothumb">'+starBtn(r.url)+'<div class="body"><div class="acc">'+esc(r.cafe)+' <span>맘카페</span></div><div class="cap" style="-webkit-line-clamp:2;font-weight:600">'+esc(r.title)+'</div>'+extra+'<div class="meta"><span>조회 '+fmt(r.reads)+'</span><span>💬 '+fmt(r.comments)+'</span><span>'+day(r.written_at||r.timestamp)+'</span><a class="open" href="'+esc(r.url)+'" target="_blank" rel="noopener">원문 →</a></div>'+scBtn(r.url)+'</div></div>'}
function whyChips(x){return (x.angle?'<div class="angle">💡 해설 각도: '+esc(x.angle)+'</div>':'')+'<div class="why">'+(x.why||[]).filter(w=>!(x.kind!=='cafe'&&(w.startsWith('평소')||w.endsWith('까지')))).map(w=>'<span>'+esc(w)+'</span>').join('')+'</div>'}
function sorted(a){a=[...a];if(sort==='ratio')a.sort((x,y)=>(y.ratio||0)-(x.ratio||0));if(sort==='new')a.sort((x,y)=>(y.timestamp||'').localeCompare(x.timestamp||''));if(sort==='like')a.sort((x,y)=>(y.likes||0)-(x.likes||0));return a}
function sortBar(extra=''){return '<div class="bar">'+[['new','최신순'],['ratio','평소 대비순'],['like','좋아요순']].map(([k,t])=>'<button class="chip'+(sort===k?' on':'')+'" data-sort="'+k+'">'+t+'</button>').join('')+extra+'</div>'}
function cafeTable(rows){if(!rows.length)return '<div class="empty">없음</div>';return '<table><tr><th></th><th>카페</th><th>제목</th><th class="n">조회</th><th class="n">댓글</th><th class="n">작성</th><th></th></tr>'+rows.map(r=>'<tr><td class="st"><button class="tstar'+(BM[r.url]?' on':'')+'" data-star="'+esc(r.url)+'">★</button></td><td>'+esc(r.cafe)+'</td><td><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a></td><td class="n">'+fmt(r.reads)+'</td><td class="n">'+fmt(r.comments)+'</td><td class="n">'+day(r.written_at)+'</td><td class="st"><button class="tsc" data-sc="'+esc(r.url)+'" title="스크립트">✍️</button></td></tr>').join('')+'</table>'}
function topicsView(){const T=D.topics||[];if(!T.length)return '';
  return '<div class="sec">요즘 엄마들 관심사<small>이번 주 맘카페 인기글 주제별 집계 · 광고·지역·단순 현황 글 제외</small></div><div class="tgrid">'+T.map(t=>{const ch=t.prev_count==null?'':(t.count>t.prev_count?'<span class="up">▲'+(t.count-t.prev_count)+'</span>':t.count<t.prev_count?'<span class="down">▼'+(t.prev_count-t.count)+'</span>':'<span class="flat">-</span>');
    return '<div class="topic"><div class="th">'+esc(t.topic)+' <b>'+t.count+'건</b> '+ch+'<small>조회 '+fmt(t.reads)+'</small></div><ul>'+t.samples.slice(0,4).map(x=>'<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a> <small>'+esc(x.cafe)+' · 조회 '+fmt(x.reads)+' · 댓글 '+x.comments+'</small></li>').join('')+'</ul></div>'}).join('')+'</div>'}
function bmView(A){const items=Object.entries(BM).map(([id,v])=>({id,...v})).sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
  let h='<div class="bar"><span class="lbl">폴더 기준</span>'+[['week','주차별'],['date','날짜별']].map(([k,t])=>'<button class="chip'+(bmMode===k?' on':'')+'" data-bm="'+k+'">'+t+'</button>').join('')+'<span class="lbl" style="margin-left:auto">찜한 날 기준 · 팀 전체 공유</span><button class="chip" data-export="1">CSV 내보내기</button></div>';
  if(!items.length)return h+'<div class="empty">카드나 표의 ★를 누르면 찜한 날짜·주차 폴더로 모여요. 팀원 모두에게 보여요.</div>';
  const groups={};for(const it of items){const g=(bmMode==='week'?weekKey:dateKey)(it.savedAt);(groups[g.key]=groups[g.key]||{label:g.label,items:[]}).items.push(it)}
  Object.keys(groups).sort().reverse().forEach((k,i)=>{const g=groups[k];const isOpen=open_[bmMode+k]??(i===0);
    h+='<details class="folder"'+(isOpen?' open':'')+' data-fold="'+bmMode+k+'"><summary>📁 '+esc(g.label)+' <small>'+g.items.length+'개</small></summary><div class="grid">'+
    g.items.map(it=>{const x=it.item||{};const note='<div class="saved">'+esc(it.savedBy||'')+' · '+kst(it.savedAt)+' 찜</div>';return x.kind==='cafe'?cafeCard(x,note):card(x,A,note)}).join('')+'</div></details>'});return h}
function exportCSV(){const rows=[['찜한시각','찜한사람','종류','계정/카페','내용','좋아요/조회','댓글','게시일','링크']];
