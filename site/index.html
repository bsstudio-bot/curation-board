<style>

.aiwhy{font-size:12.5px;color:var(--ink);margin:6px 0 4px;line-height:1.45}.score{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--coral);border-radius:4px;padding:1px 6px;margin-right:4px}
.dchk{font-size:12px;border-radius:6px;padding:5px 8px;margin:4px 0;line-height:1.45}.dchk.ok{background:#E8F5EC;color:#14532D}.dchk.diff{background:#FDECE7;color:#9A3412;font-weight:600}.dchk.unk{background:#F4F1EA;color:#6B6458}
.angle.st{background:#F1F7EE;margin-top:4px}
.angle.gm{background:#EEF0F5;margin-top:4px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:8px}.issue{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.ih{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}.is{font-size:13px;margin:6px 0}.iw{font-size:12px;color:var(--sub)}.isrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.isrc a,.isrc span{font-size:12px;background:#F4F1EA;border-radius:6px;padding:2px 7px;color:var(--navy);text-decoration:none}
.guide{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;background:#FFF6E8;border:1px solid #F3D9B1;border-radius:12px;padding:12px 16px;margin:12px 0 4px;font-size:13.5px}.guide ul{margin:6px 0 0;padding-left:18px;line-height:1.7}.gbtn{display:flex;gap:6px;flex-shrink:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.fmt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}.fref{display:flex;gap:10px;text-decoration:none;color:var(--sub);font-size:12px;align-items:center}.fth{width:54px;height:72px;border-radius:6px;background:#eee center/cover;flex-shrink:0}.fwhy{color:var(--sub);font-size:12px;margin:8px 0}.ftitle{font-weight:800;font-size:15px}.fidea{margin:4px 0 6px}.fshots{margin:6px 0;padding-left:18px;line-height:1.6}.fpriv{font-size:12px;background:#EEF0F5;border-radius:6px;padding:5px 8px}
.fbrow{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}.fbb{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--sub)}.fbb.on{background:var(--navy);color:#fff;border-color:var(--navy)}.fbtag{font-size:11.5px;font-weight:700;border-radius:4px;padding:2px 6px}.fbtag.ex{background:#F4F1EA;color:#6B6458}.fbtag.mk{background:#E8F5EC;color:#14532D}
.krs{font-size:11px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle}.krs.no{background:#E8F5EC;color:#14532D}.krs.sim{background:#FFF6DB;color:#92400E}.krs.yes{background:#F4F1EA;color:#6B6458}
.brief th{width:110px;text-align:left;vertical-align:top;color:var(--sub);font-weight:600}.brief td{font-size:13.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}.pref{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:6px}.ph2{display:flex;flex-direction:column;gap:2px}.ph2 b{font-size:15px}.ptags{display:flex;gap:5px;flex-wrap:wrap}.ptags span{font-size:11px;background:#FDECE7;color:#C2410C;border-radius:4px;padding:1px 6px}.pp{line-height:1.5}.insight{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 30px;line-height:1.7;font-size:13.5px}

.posit{background:#1B2136;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;margin:8px 0}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.dir{background:#fff;border:2px solid #F3D9B1;border-radius:14px;padding:14px 16px;font-size:13px}.dno{font-size:11px;font-weight:800;color:#C2410C}.dname{font-size:17px;font-weight:800;margin:2px 0 4px}.dcon{margin-bottom:8px;line-height:1.5}.dir dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:4px 8px}.dir dt{color:var(--sub);font-weight:700}.dir dd{margin:0;line-height:1.45}.btab th{text-align:left;color:var(--sub);font-weight:700;width:110px}.btab td{font-size:13px}

<body>
<header><div class="wrap">
  <div class="top"><h1>데일리 <b>큐레이션</b> 보드</h1><span class="upd" id="upd">불러오는 중…</span>
  <input class="search" id="q" placeholder="캡션·계정·제목 검색"><span class="who" id="who"></span></div>
  <nav id="nav"></nav>
</div></header>
<div class="wrap" id="guide"></div>
<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbx_bxTi39uwrssjbst255QjPBY_p1KNQwRA8KAgzj_h9DNHjcw3BUpfNZntsy8ItxEw/exec';
const CATS=['아이랑 갈 곳','육아 정보','해설·인물','밈·트렌드'];
const CAT_DAYS={'아이랑 갈 곳':7,'육아 정보':30,'해설·인물':30,'밈·트렌드':30};
const TABS=['찜한 후보','오늘의 추천','반응 좋은 글',...CATS,'맘카페 인기글','참고) 광고·공구','채널 목록'];
let POP=null, NOTES=[], FB={}, showEx=false, bmTab='찜', AT={}, AI=null, ruleView=false, ADS={}, SC={}, SCQ=new Set(), D=null, tab='오늘의 추천', sort='new', cafeSel='전체', kidOnly=false, q='', bmMode='week', CH=null, BM={}, LOOKUP={}, busy=false;
const open_={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'-':n>=10000?(n/10000).toFixed(n>=100000?0:1)+'만':Math.round(n).toLocaleString();
const kst=iso=>iso?new Date(iso).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const day=iso=>iso?new Date(iso).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric'}):'';
const hoursAgo=iso=>iso?(Date.now()-new Date(iso))/36e5:1e9;
const kstParts=iso=>new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}).split('-').map(Number);
const s2=n=>String(n).padStart(2,'0');const WD=['일','월','화','수','목','금','토'];
function dateKey(iso){const [y,m,d]=kstParts(iso);const dt=new Date(Date.UTC(y,m-1,d));return {key:y+'-'+s2(m)+'-'+s2(d),label:m+'월 '+d+'일 ('+WD[dt.getUTCDay()]+')'}}
function weekKey(iso){const [y,m,d]=kstParts(iso);const dt=new Date(Date.UTC(y,m-1,d));const wd=(dt.getUTCDay()+6)%7;const mon=new Date(dt-wd*864e5),sun=new Date(+mon+6*864e5),thu=new Date(+mon+3*864e5);
  const f=new Date(Date.UTC(thu.getUTCFullYear(),thu.getUTCMonth(),1));const firstThu=1+(4-f.getUTCDay()+7)%7;const n=Math.floor((thu.getUTCDate()-firstThu)/7)+1;
  const md=x=>(x.getUTCMonth()+1)+'/'+x.getUTCDate();return {key:mon.toISOString().slice(0,10),label:thu.getUTCFullYear()+'년 '+(thu.getUTCMonth()+1)+'월 '+n+'주차 ('+md(mon)+' ~ '+md(sun)+')'}}
// ---------- 팀 사용자 (이름 + 팀 비밀번호, 이 브라우저에 기억) ----------
function getUser(){try{return JSON.parse(localStorage.getItem('bs_user')||'null')}catch(e){return null}}
function setUser(u){try{localStorage.setItem('bs_user',JSON.stringify(u))}catch(e){}}
function askUser(force){let u=getUser();if(u&&!force)return u;const name=prompt('이름(찜·채널 추가 기록에 표시돼요)',u?.name||'');if(name===null)return null;const pass=prompt('팀 비밀번호',u?.pass||'');if(pass===null)return null;u={name:name.trim()||'팀원',pass:pass.trim()};setUser(u);renderUser();return u}
function renderUser(){renderGuide();const u=getUser();document.getElementById('who').innerHTML=u?esc(u.name)+' <a href="#" id="chgUser">변경</a>':'<a href="#" id="chgUser">팀 로그인</a>'}
async function api(action,body={}){const u=askUser(false);if(!u)throw new Error('취소됨');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,action,pass:u.pass,by:u.name})});const j=await r.json();
  if(!j.ok){if(/비밀번호/.test(j.error||'')){setUser(null);renderUser()}throw new Error(j.error||'실패')}return j}
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600)}

function bmFromList(list){BM={};for(const b of list||[])BM[b.id]={savedAt:b.saved_at,savedBy:b.saved_by,item:b.item}}
async function toggleBM(id){if(busy)return;const had=BM[id];const item=had?had.item:LOOKUP[id];if(!item)return;
  const u=askUser(false);if(!u)return;busy=true;
  if(had)delete BM[id];else BM[id]={savedAt:new Date().toISOString(),savedBy:u.name,item};render();
  try{const j=await api(had?'removeBookmark':'addBookmark',{id,item});bmFromList(j.bookmarks);toast(had?'찜을 뺐어요':'찜했어요 (팀 전체에 보여요)')}
  catch(e){if(had)BM[id]=had;else delete BM[id];toast('저장 실패: '+e.message,1)}finally{busy=false;render()}}

function card(p,A,extra=''){const r=p.ratio;const b=r==null?'':'<span class="badge'+(r<2?' mid':'')+'">평소 ×'+r+'</span>';
  const th=p.thumb?'<a class="thumb" href="'+esc(p.permalink)+'" target="_blank" rel="noopener" style="background-image:url(\''+esc(p.thumb)+'\')"></a>':'';
  return '<div class="card'+(p.thumb?'':' nothumb')+(p.ended?' dim':'')+'">'+starBtn(p.permalink)+th+'<div class="body"><div class="acc">@'+esc(p.handle)+' <span>'+esc((A[p.handle]||{}).name||p.name||'')+'</span></div><div class="cap">'+esc(p.caption||'(캡션 없음)')+'</div>'+extra+
  '<div class="meta">'+b+'<span>♥ '+fmt(p.likes)+'</span><span>💬 '+fmt(p.comments)+'</span><span>'+day(p.timestamp)+'</span>'+endBadge(p)+'<span class="tag">'+(p.media_type==='REELS'?'릴스':'게시물')+'</span><a class="open" href="'+esc(p.permalink)+'" target="_blank" rel="noopener">원문 →</a></div>'+scBtn(p.permalink)+'</div></div>'}

function trendCard(x,extra=''){const n=(x.news||[])[0]||{};const im=imgOf(Object.assign({kind:'trend'},x));return '<div class="card'+(im?'':' nothumb')+'">'+starBtn(x.id||('trend:'+x.title))+thumbA(im,n.url,'wide')+'<div class="body"><div class="acc">🔎 '+esc(x.title)+' <span>구글 급상승 · 검색 '+esc(x.traffic||'')+'</span></div><div class="cap" style="-webkit-line-clamp:3">'+(x.news||[]).map(k=>'· '+esc(k.title)+' <small>('+esc(k.source)+')</small>').join('<br>')+'</div>'+extra+'<div class="meta"><span>'+day(x.timestamp)+'</span>'+(n.url?'<a class="open" href="'+esc(n.url)+'" target="_blank" rel="noopener">기사 →</a>':'')+'</div>'+scBtn(x.id||('trend:'+x.title))+'</div></div>'}
function ytCard(x,extra=''){const id=x.id||('yt:'+(x.url||'').split(/[\/=]/).pop());return '<div class="card">'+starBtn(id)+'<a class="thumb" href="'+esc(x.url)+'" target="_blank" rel="noopener" style="background-image:url(\''+esc(x.thumb||'')+'\')"></a><div class="body"><div class="acc">▶ '+esc(x.channel||'')+' <span>유튜브'+(x.short?' 쇼츠':'')+'</span></div><div class="cap">'+esc(x.title||'')+'</div>'+extra+'<div class="meta"><span>조회 '+fmt(x.views)+'</span><span>♥ '+fmt(x.likes)+'</span><span>💬 '+fmt(x.comments)+'</span><span>'+day(x.timestamp||x.published)+'</span><a class="open" href="'+esc(x.url)+'" target="_blank" rel="noopener">영상 →</a></div>'+scBtn(id)+'</div></div>'}
function personCard(x,extra=''){const id=x.id||('person:'+x.title);const im=imgOf(Object.assign({kind:'person'},x));return '<div class="card'+(im?'':' nothumb')+'">'+starBtn(id)+thumbA(im,x.url||(x.sources||[])[0],'wide')+'<div class="body"><div class="acc">🧑 '+esc(x.title||'')+' <span>'+esc(String(x.ptype||'').startsWith('B')?'선택·커리어':'일반인 화제')+'</span></div><div class="cap" style="-webkit-line-clamp:4">'+esc(x.who||'')+(x.why?'<br>'+esc(x.why):'')+'</div>'+(x.character?'<div class="angle">🎭 캐릭터: '+esc(x.character)+'</div>':'')+(x.intro_point?'<div class="angle st">🎯 소개 포인트: '+esc(x.intro_point)+'</div>':'')+(x.extra_value?'<div class="angle st">🎁 시청자가 얻어갈 것: '+esc(x.extra_value)+'</div>':'')+(x.caution?'<div class="angle">⚠️ '+esc(x.caution)+'</div>':'')+extra+'<div class="meta">'+(x.signals?'<span>'+esc(String(x.signals).slice(0,60))+'</span>':'')+(x.sources||[]).slice(0,2).map((u,i)=>'<a class="open" href="'+esc(u)+'" target="_blank" rel="noopener">기사'+(i+1)+' →</a>').join('')+'</div>'+scBtn(id)+'</div></div>'}
function imgOf(x){if(!x)return '';if(x.kind==='instagram')return x.thumb||'';if(x.kind==='cafe'){if(x.thumb)return x.thumb;const r=(D&&D.cafe||[]).find(c=>c.url===x.url);return r&&r.thumb||''}if(x.kind==='trend'){if(x.picture)return x.picture;const t=((D&&D.trends&&D.trends.items)||[]).find(c=>c.title===x.title);return t&&t.picture||''}if(x.kind==='person'){if(x.image)return x.image;const p=((AI&&AI.people)||[]).find(c=>c.id===x.id||c.title===x.title);return p&&p.image||''}if(x.kind==='youtube')return x.thumb||'';return x.thumb||x.image||x.picture||''}
function thumbA(img,url,cls){return img?'<a class="thumb'+(cls?' '+cls:'')+'" href="'+esc(url||'#')+'" target="_blank" rel="noopener" style="background-image:url(\''+esc(img)+'\')"></a>':''}
function anyCard(x,A,extra){return x.kind==='person'?personCard(x,extra):x.kind==='cafe'?cafeCard(x,extra):x.kind==='trend'?trendCard(x,extra):x.kind==='youtube'?ytCard(x,extra):card(x,A,extra)}

  const kids=Y.filter(v=>v.src.startsWith('육아')&&!v.skip&&hoursAgo(v.published)<=96&&(R?(R['yt:'+v.id]||{}).shootable:true)).sort((a,b)=>(b.views_per_hour||0)-(a.views_per_hour||0)).slice(0,12);if(!kids.length)return '';
  const conv=v=>({kind:'youtube',id:'yt:'+v.id,...v,timestamp:v.published});kids.forEach(v=>{LOOKUP['yt:'+v.id]=LOOKUP['yt:'+v.id]||{...conv(v),caption:v.title+'\n'+(v.desc||'')}});
  return '<div class="sec">참고) 유튜브 육아 쇼츠 원본<small>부모가 직접 출연해 우리도 같은 구도로 찍을 수 있는 형식만 · 뉴스·CCTV·짜깁기·낭독형 제외 · 최근 4일 · 조회 속도순</small></div><div class="grid">'+kids.map(v=>{const r=R&&R['yt:'+v.id];return ytCard(conv(v),r&&r.format?'<div class="angle">형식: '+esc(r.format)+'</div>':'')}).join('')+'</div>'}

  h+='<div class="sec">채널별 광고·공구 비중<small>최근 '+adDays+'일 · 수집된 게시물 기준</small></div>';

    return '<tr><td>'+esc(a.cat)+'</td><td><a href="https://www.instagram.com/'+esc(a.handle)+'/" target="_blank" rel="noopener">@'+esc(a.handle)+'</a></td><td class="n">'+a.ad+'/'+a.total+'</td><td class="n"><span class="pct'+(pct>=50?' hi':pct>=25?' mid':'')+'">'+pct+'%</span></td><td class="n">'+(a.gonggu||'')+'</td><td class="n">'+(a.spon||'')+'</td><td class="n">'+(a.event||'')+'</td><td class="n">'+day(a.last)+'</td><td class="brands">'+br+'</td></tr>'}).join('')+'</table>';
  if(topBrands.length)h+='<div class="sec">여러 채널이 같이 태그한 브랜드<small>광고·공구 글 속 @태그 기준 · 협업이 활발한 브랜드 찾기용</small></div><div class="bchips">'+topBrands.map(([b,v])=>{const bp=(D.brands||{})[b]||{};return '<a class="bchip" href="'+esc(bp.website||('https://www.instagram.com/'+b+'/'))+'" target="_blank" rel="noopener">@'+esc(b)+(bp.name&&bp.name!==b?' '+esc(bp.name):'')+' <small>채널 '+v.by.size+' · 글 '+v.n+((bp.emails||[]).length?' · '+esc(bp.emails[0]):'')+'</small></a>'}).join('')+'</div>';
  const recent=P.filter(p=>adType(p.caption)&&match(p.caption+p.handle)).sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||'')).slice(0,40);
  h+='<div class="sec">최근 광고·공구 글<small>최신순 40개</small></div><div class="grid">'+recent.map(p=>card(p,A,'<div class="why"><span class="adt">'+adType(p.caption)+'</span></div>')).join('')+'</div>';
  return h}

function okRecent(p){return !p.flag&&!adType(p.caption)&&!p.ended&&(p.likes||0)>=(D.rules?.min_likes||100)&&hoursAgo(p.timestamp)<=(D.rules?.max_hours||72)}
function render(){if(!D)return;const A=accMap(),P=D.instagram.posts;
  const inCat=c=>P.filter(p=>p.cat===c&&!p.ended&&hoursAgo(p.timestamp)<=CAT_DAYS[c]*24);
  const counts={};CATS.forEach(c=>counts[c]=inCat(c).length);
  document.getElementById('nav').innerHTML=TABS.map(t=>'<button class="'+(t===tab?'on':'')+(t==='찜한 후보'?' fav':'')+'" data-tab="'+t+'">'+t+(counts[t]!=null?'<span class="cnt">'+counts[t]+'</span>':t==='찜한 후보'?'<span class="cnt">'+Object.keys(BM).length+'</span>':t==='스크립트'?'<span class="cnt">'+Object.keys(SC).length+'</span>':'')+'</button>').join('');
  let h='';
  if(tab==='오늘의 추천'){const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});const useAI=AI&&AI.picks&&AI.picks.length&&!ruleView;
    h+='<div class="bar">'+(AI&&AI.picks?'<button class="chip'+(!ruleView?' on':'')+'" data-rv="0">Claude 큐레이션'+(AI.date!==today?' ('+AI.date+')':'')+'</button><button class="chip'+(ruleView?' on':'')+'" data-rv="1">규칙 기반</button>':'')+'<span class="lbl" style="margin-left:auto">'+(useAI?'고몽 신규 채널 기준 · '+kst(AI.generated_at)+' · 후보 '+AI.pool_size+'개 중':'')+'</span></div>';
    if(useAI){h+=issuesView();const order=['화제 인물','아이랑 갈 곳','왜 그럴까','밈·트렌드','화제','육아 정보','맘카페 화제'];const P2all=AI.picks.filter(x=>x.kind!=='instagram'||!adType(x.caption));const exN=P2all.filter(x=>FB[x.id]&&FB[x.id].status==='제외').length;const P2=showEx?P2all:P2all.filter(x=>!(FB[x.id]&&FB[x.id].status==='제외'));if(exN)h+='<div class="note" style="margin:8px 0">팀이 제외한 '+exN+'개는 숨겼어요. <a href="#" data-showex="1">'+(showEx?'다시 숨기기':'보기')+'</a></div>';
      for(const sname of [...order,...new Set(P2.map(x=>x.series).filter(x=>!order.includes(x)))]){const g=P2.filter(x=>x.series===sname).sort((a,b)=>(b.score||0)-(a.score||0));if(!g.length)continue;h+='<div class="sec">'+esc(sname)+'<small>'+g.length+'개</small></div><div class="grid">'+g.map(x=>anyCard(x,A,aiChips(x))).join('')+'</div>'}
      h+=peopleView()+formatsView()+ytView()+trendsView();
    } else {
    {const picks=(D.picks||[]).filter(x=>x.kind==='cafe'||!adType(x.caption));const order=['아이랑 갈 곳','왜 그럴까','밈·트렌드','육아 정보','맘카페 화제'];
    h+='<div class="intro">우리 채널 기준으로 고른 오늘의 후보예요. 최근 3일 안에 올라온 글 중 좋아요·조회 100 이상만 보고, 광고·공구·정치·가십·스포츠, 단순 현황·지역 한정 글, 이미 끝난 행사는 뺐어요. 💡는 캉가에처럼 쉽게 풀어 설명할 때 잡을 만한 질문이에요.</div>';
    if(!picks.length)h+='<div class="empty">오늘은 기준에 맞는 글이 없어요.</div>';
    for(const sname of order){const g=picks.filter(x=>x.series===sname);if(!g.length)continue;h+='<div class="sec">'+sname+'<small>'+esc(g[0].use)+'</small></div><div class="grid">'+g.map(x=>x.kind==='cafe'?cafeCard(x,whyChips(x)):card(x,A,whyChips(x))).join('')+'</div>'}
    }}
  } else if(tab==='반응 좋은 글'){const hot=P.filter(p=>okRecent(p)&&p.ratio>=2&&match(p.caption+p.handle)).sort((a,b)=>b.ratio-a.ratio);
    h+='<div class="sec">인스타 반응 좋은 글<small>최근 3일 · 좋아요 100 이상 · 평소의 2배 이상 · 광고·정치·가십·종료 행사 제외</small></div>'+(hot.length?'<div class="grid">'+hot.slice(0,30).map(p=>card(p,A)).join('')+'</div>':'<div class="empty">조건에 맞는 글이 없어요.</div>');
    const top=D.cafe.filter(r=>kidRe.test(r.title)&&!r.flag&&r.reads>=100&&hoursAgo(r.written_at)<=72&&match(r.title)).sort((a,b)=>b.reads-a.reads).slice(0,10);
    h+='<div class="sec">맘카페 육아 인기글<small>최근 3일 · 조회 100 이상 · 광고·지역 한정·단순 현황 제외</small></div>'+cafeTable(top);
  } else if(counts[tab]!=null){const TM=((AI&&AI.taste_match)||{})[tab]||[];const byId=Object.fromEntries(P.map(p=>[p.permalink,p]));const TMx=TM.map(t=>({t,p:byId[t.id]})).filter(x=>x.p&&!(FB[x.p.permalink]&&FB[x.p.permalink].status==='제외'));
    if(TMx.length)h+='<div class="sec tastesec">★ 찜 취향과 비슷한 글<small>찜한 후보를 분석한 팀 취향 기준 · Claude가 매일 아침 골라요 · '+kst(AI.taste_at)+'</small></div><div class="grid">'+TMx.map(({t,p})=>card(p,A,'<div class="aiwhy"><span class="score">취향 '+esc(t.score)+'</span> '+esc(t.reason||'')+'</div>')).join('')+'</div><div class="sec">전체 글</div>';
    h+=sortBar('<span class="lbl" style="margin-left:auto">최근 '+CAT_DAYS[tab]+'일 안에 올라온 글만 · 끝난 행사 제외</span>')+'<div class="grid">'+sorted(inCat(tab).filter(p=>match(p.caption+p.handle))).map(p=>card(p,A)).join('')+'</div>';
  } else if(tab==='맘카페 인기글'){h+=topicsView();const names=['전체',...new Set(D.cafe.map(r=>r.cafe))];
    h+='<div class="sec">주간 인기글 전체</div><div class="bar">'+names.map(n=>'<button class="chip'+(cafeSel===n?' on':'')+'" data-cafe="'+esc(n)+'">'+esc(n)+'</button>').join('')+'<button class="chip'+(kidOnly?' on':'')+'" data-kid="1">정보 글만</button></div>';
    const rows=D.cafe.filter(r=>(cafeSel==='전체'||r.cafe===cafeSel)&&(!kidOnly||!r.flag)&&match(r.title)).sort((a,b)=>b.reads-a.reads).slice(0,200);
    h+=cafeTable(rows)+'<div class="note">로그인 없이 공개되는 주간 인기글 기준이에요. 맘스홀릭·레몬테라스·맘이베베는 가입해야 보여서 빠져 있어요.</div>';
  } else if(tab==='🍿 팝콘 리서치'){h+=popcornView()} else if(tab==='참고) 광고·공구'){h+=adView(A)} else if(tab==='찜한 후보'){h+=bmView(A)} else if(tab==='스크립트'){h+=scriptView()} else if(tab==='채널 목록'){h+=channelView()}
  document.getElementById('main').innerHTML=h}
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render()};
document.addEventListener('click',async e=>{const a=e.target.closest('a#chgUser');if(a){e.preventDefault();askUser(true);return}
  if(e.target.id==='modal'){e.target.className='modal';return}
  const si=e.target.closest('.scitem');if(si){scModal(si.dataset.sc);return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0)}
  if(t.dataset.sort){sort=t.dataset.sort;render()}
  if(t.dataset.cafe){cafeSel=t.dataset.cafe;render()}
  if(t.dataset.kid){kidOnly=!kidOnly;render()}
  if(t.dataset.bm){bmMode=t.dataset.bm;render()}
  if(t.dataset.addnote){addNote()}
  if(t.dataset.delnote){delNote(t.dataset.delnote)}
  if(t.dataset.gclose){localStorage.setItem('guide_closed','1');renderGuide()}
  if(t.dataset.login){askUser(true);renderGuide()}
  if(t.dataset.rv){ruleView=t.dataset.rv==='1';render()}
  if(t.dataset.addays){adDays=+t.dataset.addays;render()}
  if(t.dataset.adcsv){adCSV()}
  if(t.dataset.export){exportCSV()}
  if(t.dataset.star){e.preventDefault();toggleBM(t.dataset.star)}
  if(t.dataset.fb){e.preventDefault();setFB(t.dataset.fb,t.dataset.fbs)}
  if(t.dataset.showex){e.preventDefault();showEx=!showEx;render()}
  if(t.dataset.bmtab){bmTab=t.dataset.bmtab;render()}
  if(t.dataset.sc){openScript(t.dataset.sc)}
  if(t.dataset.scgen){genScript(t.dataset.scgen)}
  if(t.dataset.mclose){document.getElementById('modal').className='modal'}
  if(t.dataset.sccopy){navigator.clipboard.writeText(scText(SC[t.dataset.sccopy].script)).then(()=>toast('대본을 복사했어요'))}
  if(t.dataset.sccopyall){navigator.clipboard.writeText(scFull(SC[t.dataset.sccopyall].script)).then(()=>toast('전체를 복사했어요'))}
  if(t.dataset.addch){const h=document.getElementById('chHandle').value.trim();if(!h)return toast('링크나 아이디를 넣어주세요',1);
    try{t.disabled=true;const j=await api('addChannel',{handle:h,cat:document.getElementById('chCat').value,note:document.getElementById('chNote').value.trim()});CH=j.channels;toast('@'+j.handle+' 추가했어요');render()}catch(err){toast(err.message,1)}finally{t.disabled=false}}
  if(t.dataset.delch){if(!confirm('@'+t.dataset.delch+' 채널을 삭제할까요? (삭제한 채널 목록에서 복구할 수 있어요)'))return;try{const j=await api('removeChannel',{handle:t.dataset.delch});CH=j.channels;toast('삭제했어요. 다음 수집부터 빠져요');render()}catch(err){toast(err.message,1)}}
  if(t.dataset.resch){try{const j=await api('restoreChannel',{handle:t.dataset.resch});CH=j.channels;toast('복구했어요');render()}catch(err){toast(err.message,1)}}
  if(t.dataset.collect){if(!confirm('지금 수집을 시작할까요? 2~3분 걸려요.'))return;try{await api('collectNow');toast('수집을 시작했어요. 2~3분 뒤 새로고침해 주세요')}catch(err){toast(err.message,1)}}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.fold)open_[d.dataset.fold]=d.open},true);
renderUser();
Promise.all([fetch('data.json?'+Date.now()).then(r=>r.json()),fetch(API+'?action=all').then(r=>r.json()).catch(()=>null),fetch(API+'?action=ads').then(r=>r.json()).catch(()=>null),fetch('https://raw.githubusercontent.com/bsstudio-bot/curation-board/main/site/ai.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),fetch('https://raw.githubusercontent.com/bsstudio-bot/curation-board/main/site/account_types.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),fetch('popcorn.json?'+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,s,ad,ai,at,pop])=>{D=d;AI=ai;POP=pop;loadNotes();AT=(at&&at.types)||{};if(AI)for(const x of [...(AI.picks||[]),...(AI.issues||[]).flatMap(i=>i.items||[])]){LOOKUP[x.id]={...(LOOKUP[x.id]||{}),...x}}if(ad&&ad.ok)for(const x of ad.ads)ADS[x.id]=x;kidRe=new RegExp((d.kid_keywords||['아이랑']).join('|'));
  for(const p of d.instagram.posts)LOOKUP[p.permalink]={kind:'instagram',...p};for(const r of d.cafe)LOOKUP[r.url]={kind:'cafe',...r};
  for(const x of d.picks||[]){const id=x.permalink||x.url;LOOKUP[id]={...(LOOKUP[id]||{}),...x}}
  if(s&&s.ok){applyShared(s);if(SCQ.size)startPoll()}else toast('공유 저장소를 불러오지 못했어요',1);
  // 예전에 이 브라우저에만 찜한 것 → 공유 찜으로 옮기기
  try{const old=JSON.parse(localStorage.getItem('bookmarks_v2')||'{}');const ids=Object.keys(old).filter(id=>!BM[id]);if(ids.length&&getUser()){(async()=>{for(const id of ids){try{await api('addBookmark',{id,item:old[id].item})}catch(e){}}localStorage.removeItem('bookmarks_v2');const s2=await fetch(API+'?action=all').then(r=>r.json());bmFromList(s2.bookmarks);render()})()}}catch(e){}
  const ig=d.instagram;document.getElementById('upd').textContent='업데이트 '+kst(d.updated_at)+' · 인스타 '+(ig.source.startsWith('meta')?'자동':'수동')+' 수집';render()})
  .catch(e=>{document.getElementById('main').innerHTML='<div class="empty err">데이터를 불러오지 못했어요: '+esc(e.message)+'</div>'});
</script>
